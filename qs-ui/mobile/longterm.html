    let expandedCode = null;
    let klineChart = null;
    let currentTimeframe = 'day';

    // Helper: generate unique DOM ID from stock code
    function chartId(code) { return 'kline-' + code.replace(/\./g, '-'); }

    // Helper: format number for financial table
    function fmt(n) {
      if (n === null || n === undefined || isNaN(n)) return '【数据缺失】';
      return n.toLocaleString('en-US', { maximumFractionDigits: 1, minimumFractionDigits: 1 });

    // Render the stock list (collapsed cards)
    function renderStockList() {

      container.innerHTML = stocks.map(function(stock) {

          <div class="stock-card" data-code="' + stock.code + '" onclick="toggleStock(\'' + stock.code + '\')">\

              <div style="display:flex;align-items:center;gap:8px;">\

            </div>\
            <div class="stock-metrics">\
              <span class="stock-metric">PE <span class="metric-val">' + stock.pe + '</span></span>\
              <span class="stock-metric">PB <span class="metric-val">' + (stock.pb == null ? '【数据缺失】' : stock.pb) + '</span></span>\
              <span class="stock-metric">ROE <span class="metric-val">' + stock.roe + '%</span></span>\
              <span class="stock-metric">股息 <span class="metric-val">' + stock.dividendYield + '%</span></span>\

      }).join('');
    }

    // Render detail HTML for a stock
    function renderDetailHTML(stock) {
      var id = chartId(stock.code);
      var changeColor = stock.changePct >= 0 ? 'var(--qs-state-rise)' : 'var(--qs-state-fall)';
      var changeSign = stock.changePct >= 0 ? '+' : '';
      var growthColor = stock.netProfitGrowth >= 0 ? 'var(--qs-state-rise)' : 'var(--qs-state-fall)';
      var growthSign = stock.netProfitGrowth >= 0 ? '+' : '';
      var floatSub = (stock.floatCap && stock.marketCap === stock.floatCap) ? '全流通' : (stock.floatCap ? '部分流通' : '流通数据缺失');
      var finYearCols = (stock.finYears || ['—','—','—','—']).map(function(y){ return '<th>' + y + '</th>'; }).join('');
      function fmtv(n) { return (n === null || n === undefined || isNaN(n)) ? '【数据缺失】' : fmt(n); }

      // Factor rows
      var factors = [
        { label: '价值', score: stock.factors.value, color: 'var(--qs-primary)' },
        { label: '质量', score: stock.factors.quality, color: 'var(--qs-state-fall)' },
        { label: '成长', score: stock.factors.growth, color: 'var(--qs-state-info)' },
        { label: '动量', score: stock.factors.momentum, color: 'var(--qs-state-warning)' }
      ];
      var factorRows = factors.map(function(f) {
        return '<div class="factor-row">\
          <span class="factor-label">' + f.label + '</span>\
          <div class="factor-bar"><div class="factor-bar-fill" style="width:' + f.score + '%;background:' + f.color + '"></div></div>\
          <span class="factor-val">' + f.score + '</span>\
        </div>';
      }).join('');

      // Financial table rows
      var finLabels = ['营业收入', '归母净利润', '扣非净利润', '经营现金流'];
      var finData = [stock.financials.revenue, stock.financials.netProfit, stock.financials.deducted, stock.financials.cashFlow];
      var finRows = finLabels.map(function(label, i) {
        return '<tr>\
          <td>' + label + '</td>\
          <td>' + fmtv(finData[i][0]) + '</td>\
          <td>' + fmtv(finData[i][1]) + '</td>\
          <td>' + fmtv(finData[i][2]) + '</td>\
          <td>' + fmtv(finData[i][3]) + '</td>\
        </tr>';
      }).join('');

      // Top holders rows
      var holderRows = stock.topHolders.map(function(h) {
        return '<tr>\
          <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + h.name + '</td>\
          <td>' + h.shares + '</td>\
          <td>' + h.pct + '</td>\
          <td style="color:' + h.color + '">' + h.change + '</td>\
        </tr>';
      }).join('');

      return '\
        <div class="detail-header">\
          <div>\
            <div class="detail-name">' + stock.name + '</div>\
            <div class="detail-code">' + stock.code + '</div>\
            <span class="sector-tag">' + stock.sector + '</span>\
          </div>\
          <div class="detail-score">\
            <span class="score-label">综合评分</span>【数据缺失】<span class="score-num">' + stock.score + '</span>\
          </div>\
        </div>\
        \
        <div class="card">\
          <div class="kline-price-row">\
            <span class="kline-price" id="price-' + id + '">' + stock.price.toFixed(2) + '</span>\
            <span class="kline-change" id="change-' + id + '" style="color:' + changeColor + '">' + changeSign + stock.changePct.toFixed(2) + '%</span>\
          </div>\
          <div class="kline-stats">\
            <div class="kline-stat"><span class="stat-label">最高</span><span class="stat-val" id="high-' + id + '">1286.15</span></div>\
            <div class="kline-stat"><span class="stat-label">最低</span><span class="stat-val" id="low-' + id + '">1263.01</span></div>\
            <div class="kline-stat"><span class="stat-label">开盘</span><span class="stat-val" id="open-' + id + '">1285.15</span></div>\
            <div class="kline-stat"><span class="stat-label">昨收</span><span class="stat-val" id="preclose-' + id + '">1285.13</span></div>\
          </div>\
          <div style="margin-top:10px;">\
            <div class="timeframe-group" id="tf-' + id + '">\
              <button class="timeframe-btn" data-tf="intraday" type="button">分时</button>\
              <button class="timeframe-btn active" data-tf="day" type="button">日K</button>\
              <button class="timeframe-btn" data-tf="week" type="button">周K</button>\
              <button class="timeframe-btn" data-tf="month" type="button">月K</button>\
            </div>\
          </div>\
          <div class="chart-wrap">\
            <canvas id="' + id + '"></canvas>\
          </div>\
        </div>\
        \
        <div class="card">\
          <div class="section-title"><i data-lucide="bar-chart-3" style="width:16px;height:16px;color:var(--qs-primary);"></i>因子得分</div>\
          ' + factorRows + '\
        </div>\
        \
        <div class="card">\
          <div class="section-title"><i data-lucide="layout-grid" style="width:16px;height:16px;color:var(--qs-primary);"></i>核心指标</div>\
          <div class="metric-grid">\
            <div class="metric-cell"><span class="mc-label">市盈率 (PE-TTM)</span><span class="mc-val">' + stock.pe + '</span><span class="mc-sub">TTM</span></div>\
            <div class="metric-cell"><span class="mc-label">市净率 (PB)</span><span class="mc-val">' + stock.pb + '</span><span class="mc-sub">MRQ</span></div>\
            <div class="metric-cell"><span class="mc-label">ROE (TTM)</span><span class="mc-val" style="color:var(--qs-state-fall)">' + stock.roe + '%</span><span class="mc-sub">净资产收益率</span></div>\
            <div class="metric-cell"><span class="mc-label">净利润增速</span><span class="mc-val" style="color:' + growthColor + '">' + (stock.netProfitGrowth == null ? '【数据缺失】' : growthSign + stock.netProfitGrowth + '%') + '</span><span class="mc-sub">YoY</span></div>\
            <div class="metric-cell"><span class="mc-label">毛利率</span><span class="mc-val">' + stock.grossMargin + '%</span><span class="mc-sub">最新报告期</span></div>\
            <div class="metric-cell"><span class="mc-label">净利率</span><span class="mc-val">' + stock.netMargin + '%</span><span class="mc-sub">最新报告期</span></div>\
            <div class="metric-cell"><span class="mc-label">总市值</span><span class="mc-val">' + stock.marketCap + '</span><span class="mc-sub">' + floatSub + '</span></div>\
            <div class="metric-cell"><span class="mc-label">流通市值</span><span class="mc-val">' + (stock.floatCap == null ? '【数据缺失】' : stock.floatCap) + '</span><span class="mc-sub">流通占比</span></div>\
            <div class="metric-cell"><span class="mc-label">股息率</span><span class="mc-val">' + stock.dividendYield + '%</span><span class="mc-sub">近12月</span></div>\
            <div class="metric-cell"><span class="mc-label">自由现金流/营收</span><span class="mc-val">' + (stock.fcf == null ? '【数据缺失】' : stock.fcf + '%') + '</span><span class="mc-sub">FCF Margin</span></div>\
          </div>\
        </div>\
        \
        <div class="card">\
          <div class="section-title"><i data-lucide="table" style="width:16px;height:16px;color:var(--qs-primary);"></i>财务数据 (亿元)</div>\
          <div class="table-wrap">\
            <table class="fin-table">\
              <thead>\
                <tr>\
                  <th>项目</th>\
                  ' + finYearCols + '\
                </tr>\
              </thead>\
              <tbody>\
                ' + finRows + '\
              </tbody>\
            </table>\
          </div>\
        </div>\
        \
        <div class="card">\
          <div class="section-title"><i data-lucide="building-2" style="width:16px;height:16px;color:var(--qs-primary);"></i>机构持仓</div>\
          <div class="inst-hold-grid">\
            <div class="inst-hold-cell"><span class="ih-label">基金持仓比例</span><span class="ih-val">' + (stock.fundHold == null ? '【数据缺失】' : stock.fundHold + '%') + '</span></div>\
            <div class="inst-hold-cell"><span class="ih-label">北向资金持股</span><span class="ih-val">' + (stock.northHold == null ? '【数据缺失】' : stock.northHold + '%') + '</span></div>\
          </div>\
          <div class="table-wrap">\
            <table class="fin-table">\
              <thead>\
                <tr>\
                  <th>股东名称</th>\
                  <th>持股数量</th>\
                  <th>比例</th>\
                  <th>变动</th>\
                </tr>\
              </thead>\
              <tbody>\
                ' + holderRows + '\
              </tbody>\
            </table>\
          </div>\
        </div>\
        \
        <div class="card">\
          <div class="section-title"><i data-lucide="file-text" style="width:16px;height:16px;color:var(--qs-primary);"></i>基本面摘要</div>\
          <p class="summary-text">' + stock.summary + '</p>\
        </div>';
    }

    // Generate synthetic OHLC data
    function genOHLC(basePrice, count, timeframe) {
      var data = [];
      var price = basePrice * 0.92;
      var step = basePrice * (timeframe === 'month' ? 0.025 : timeframe === 'week' ? 0.015 : 0.008);
      for (var i = 0; i < count; i++) {
        var change = (Math.random() - 0.48) * step;
        var open = price;
        var close = price + change;
        var high = Math.max(open, close) + Math.random() * step * 0.4;
        var low = Math.min(open, close) - Math.random() * step * 0.4;
        data.push({ x: i, o: open, h: high, l: low, c: close });
        price = close;
      }
      if (data.length) data[data.length - 1].c = basePrice;
      return data;
    }

    // Render K-line chart for a stock
    function renderKline(stock, timeframe) {
      var id = chartId(stock.code);
      var canvas = document.getElementById(id);
      if (!canvas || typeof Chart === 'undefined') return;

      if (klineChart) { klineChart.destroy(); klineChart = null; }

      var style = getComputedStyle(document.documentElement);
      var rise = style.getPropertyValue('--qs-state-rise').trim() || '#ef5350';
      var fall = style.getPropertyValue('--qs-state-fall').trim() || '#26c584';
      var primary = style.getPropertyValue('--qs-primary').trim() || '#2dd4bf';
      var ink3 = style.getPropertyValue('--qs-ink-3').trim() || '#6c6c80';
      var lineColor = style.getPropertyValue('--qs-line').trim() || '#2a2a36';

      var basePrice = stock.price;
      var changePct = stock.changePct;
      var count = timeframe === 'intraday' ? 48 : (timeframe === 'month' ? 30 : (timeframe === 'week' ? 60 : 90));
      var realK = stock.kline && (stock.kline[timeframe] || (timeframe === 'intraday' ? stock.kline.day : null));
      var ohlc = realK ? realK.map(function(d){ return { o: d[1], h: d[2], l: d[3], c: d[4] }; }) : genOHLC(basePrice, count, timeframe);
      var labels = ohlc.map(function(_, i) { return i + 1; });
      var closes = ohlc.map(function(d) { return d.c; });

      // Update K-line header stats
      var changeColor = changePct >= 0 ? rise : fall;
      var sign = changePct >= 0 ? '+' : '';
      function setText(elId, text) { var el = document.getElementById(elId); if (el) el.textContent = text; }
      function setColor(elId, color) { var el = document.getElementById(elId); if (el) el.style.color = color; }

      setText('price-' + id, basePrice.toFixed(2));
      setText('change-' + id, sign + changePct.toFixed(2) + '%');
      setColor('change-' + id, changeColor);
      setText('high-' + id, (stock.stats ? stock.stats.high : basePrice * 1.018).toFixed(2));
      setText('low-' + id, (stock.stats ? stock.stats.low : basePrice * 0.982).toFixed(2));
      setText('open-' + id, (stock.stats ? stock.stats.open : basePrice * 0.995).toFixed(2));
      setText('preclose-' + id, (stock.stats ? stock.stats.preclose : basePrice / (1 + changePct / 100)).toFixed(2));

      klineChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '收盘价',
            data: closes,
            segment: {
              borderColor: function(ctx) {
                var idx = ctx.p0DataIndex;
                if (idx === 0) return primary;
                var prev = ctx.chart.data.datasets[0].data[idx - 1];
                var cur = ctx.chart.data.datasets[0].data[idx];
                return cur >= prev ? rise : fall;
              }
            },
            backgroundColor: 'rgba(45, 212, 191, 0.08)',
            borderWidth: 1.5,
            pointRadius: 0,
            pointHoverRadius: 4,
            tension: 0.1,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1a22',
              titleColor: '#f2f2f5',
              bodyColor: '#a0a0b0',
              borderColor: '#2a2a36',
              borderWidth: 1,
              callbacks: {
                label: function(context) {
                  var d = ohlc[context.dataIndex];
                  return '开 ' + d.o.toFixed(2) + '  高 ' + d.h.toFixed(2) + '  低 ' + d.l.toFixed(2) + '  收 ' + d.c.toFixed(2);
                }
              }
            }
          },
          scales: {
            x: { display: false },
            y: {
              position: 'right',
              grid: { color: lineColor },
              ticks: { color: ink3, font: { size: 10 } }
            }
          }
        }
      });
    }

    // Destroy current chart
    function destroyChart() {
      if (klineChart) { klineChart.destroy(); klineChart = null; }
    }

    // Attach timeframe button handlers
    function attachTimeframeHandlers(stock) {
      var id = chartId(stock.code);
      var group = document.getElementById('tf-' + id);
      if (!group) return;
      var btns = group.querySelectorAll('.timeframe-btn');
      for (var i = 0; i < btns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            for (var j = 0; j < btns.length; j++) { btns[j].classList.remove('active'); }
            btn.classList.add('active');
            currentTimeframe = btn.getAttribute('data-tf');
            renderKline(stock, currentTimeframe);
          });
        })(btns[i]);
      }
    }

    // Toggle stock detail (accordion: one open at a time)
    function toggleStock(code) {
      // Collapse if already expanded
      if (expandedCode === code) {
        destroyChart();
        var detail = document.getElementById('detail-' + chartId(code));
        if (detail) { detail.innerHTML = ''; detail.style.display = 'none'; }
        var card = document.querySelector('.stock-card[data-code="' + code + '"]');
        if (card) card.classList.remove('expanded');
        expandedCode = null;
        return;
      }

      // Collapse previous
      if (expandedCode) {
        destroyChart();
        var prevDetail = document.getElementById('detail-' + chartId(expandedCode));
        if (prevDetail) { prevDetail.innerHTML = ''; prevDetail.style.display = 'none'; }
        var prevCard = document.querySelector('.stock-card[data-code="' + expandedCode + '"]');
        if (prevCard) prevCard.classList.remove('expanded');
      }

      // Expand new
      var stock = null;
      for (var i = 0; i < stocks.length; i++) {
        if (stocks[i].code === code) { stock = stocks[i]; break; }
      }
      if (!stock) return;

      var id = chartId(code);
      var detail = document.getElementById('detail-' + id);
      if (!detail) return;

      detail.innerHTML = renderDetailHTML(stock);
      detail.style.display = 'block';

      var card = document.querySelector('.stock-card[data-code="' + code + '"]');
      if (card) card.classList.add('expanded');

      expandedCode = code;
      currentTimeframe = 'day';

      // Re-render icons for the newly injected detail HTML
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Attach timeframe handlers
      attachTimeframeHandlers(stock);

      // Render chart after DOM is ready
      setTimeout(function() { renderKline(stock, currentTimeframe); }, 50);
    }

    // Initialize
    renderStockList();
    lucide.createIcons();
  </script>
