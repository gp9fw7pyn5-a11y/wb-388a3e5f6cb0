    // Generate synthetic OHLC data
    function genOHLC(basePrice, count, timeframe) {
      var data = [];
      var price = basePrice * 0.92;
      var step = basePrice * (timeframe === 'month' ? 0.025 : timeframe === 'week' ? 0.015 : 0.008);
      for (var i = 0; i < count; i++) {
        var change = (Math.random() - 0.48) * step;
        var open = price;
        var close = price + change;
        var high = Math.max(open, close) + Math.random() * step * 0.4;
        var low = Math.min(open, close) - Math.random() * step * 0.4;
        data.push({ x: i, o: open, h: high, l: low, c: close });
        price = close;
      }
      if (data.length) data[data.length - 1].c = basePrice;
      return data;
    }

      var labels = ohlc.map(function(_, i) { return i + 1; });

      var btns = group.querySelectorAll('.timeframe-btn');
      for (var i = 0; i < btns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            for (var j = 0; j < btns.length; j++) { btns[j].classList.remove('active'); }
            btn.classList.add('active');
            currentTimeframe = btn.getAttribute('data-tf');
            renderKline(stock, currentTimeframe);
          });
        })(btns[i]);
      }
    }

    // Toggle stock detail (accordion: one open at a time)
    function toggleStock(code) {
      // Collapse if already expanded
      if (expandedCode === code) {
        destroyChart();
        var detail = document.getElementById('detail-' + chartId(code));
        if (detail) { detail.innerHTML = ''; detail.style.display = 'none'; }
        var card = document.querySelector('.stock-card[data-code="' + code + '"]');
        if (card) card.classList.remove('expanded');
        expandedCode = null;
        return;
      }

      // Collapse previous
      if (expandedCode) {
        destroyChart();
        var prevDetail = document.getElementById('detail-' + chartId(expandedCode));
        if (prevDetail) { prevDetail.innerHTML = ''; prevDetail.style.display = 'none'; }
        var prevCard = document.querySelector('.stock-card[data-code="' + expandedCode + '"]');
        if (prevCard) prevCard.classList.remove('expanded');
      }

      // Expand new
      var stock = null;
      for (var i = 0; i < stocks.length; i++) {
        if (stocks[i].code === code) { stock = stocks[i]; break; }
      }
      if (!stock) return;

      var id = chartId(code);
      var detail = document.getElementById('detail-' + id);
      if (!detail) return;

      detail.innerHTML = renderDetailHTML(stock);
      detail.style.display = 'block';

      var card = document.querySelector('.stock-card[data-code="' + code + '"]');
      if (card) card.classList.add('expanded');

      expandedCode = code;
      currentTimeframe = 'day';

      // Re-render icons for the newly injected detail HTML
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Attach timeframe handlers
      attachTimeframeHandlers(stock);

      // Render chart after DOM is ready
      setTimeout(function() { renderKline(stock, currentTimeframe); }, 50);
    }

    // Initialize
    renderStockList();
    lucide.createIcons();
  </script>
</body>
</html>
